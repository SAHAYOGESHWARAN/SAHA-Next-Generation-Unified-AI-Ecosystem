version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: saha-postgres
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_secure_password
      POSTGRES_DB: saha_nexus_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - saha-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus_user -d saha_nexus_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: saha-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - saha-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: saha-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: nexus_user
      DB_PASSWORD: nexus_secure_password
      DB_NAME: saha_nexus_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRATION: 24h
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_REFRESH_EXPIRATION: 7d
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/src:/app/src
      - ../backend/node_modules:/app/node_modules
    networks:
      - saha-network
    command: npm run dev

  # Frontend (Optional - for development)
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: saha-frontend
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ../frontend/src:/app/src
  #     - ../frontend/node_modules:/app/node_modules
  #   networks:
  #     - saha-network
  #   command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  saha-network:
    driver: bridge
